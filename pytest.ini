[pytest]
testpaths = tests
asyncio_mode = auto
# Все async-фикстуры и тесты — в одном loop-скоупе (function). Сессионная подготовка схемы
# (tests/conftest.py::_test_schema) синхронна и крутит собственный asyncio.run(), поэтому
# конфликтов loop-скоупов нет.
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning:passlib.*
