services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: pdd
      POSTGRES_PASSWORD: pdd
      POSTGRES_DB: pdd
    # Порт НЕ публикуется на все интерфейсы (0.0.0.0), как того требует ТЗ (раздел 1.4.2:
    # "порты PostgreSQL (5432) и backend (8000) наружу не публикуются, доступны только внутри
    # Docker-сети"). 127.0.0.1:5432 оставлен для локальной разработки — так psql/DBeaver/
    # TablePlus с хост-машины по-прежнему подключаются к localhost:5432, но с внешнего IP
    # сервера порт недоступен. На проде эту привязку тоже стоит держать (полезно для ручной
    # диагностики по SSH-туннелю), либо убрать секцию ports целиком — тогда db останется
    # доступна только другим контейнерам той же docker-compose сети по имени "db".
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pdd_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdd"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pdd:pdd@db:5432/pdd
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pdd_pg_data:
